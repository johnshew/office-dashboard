name: Roll back Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release whose original site artifact should be restored
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rollback-pages
  cancel-in-progress: false

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      provenance: ${{ steps.verify.outputs.provenance }}
    steps:
      - name: Download and verify original release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo 'Dispatch rollback from the default branch.'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable version tag.'; exit 1; }
          gh release download "$RELEASE_TAG" --pattern office-dashboard.tar.gz --pattern SHA256SUMS
          sha256sum --check SHA256SUMS
          mkdir dist
          tar -xzf office-dashboard.tar.gz -C dist
          test -f dist/index.html
          echo "provenance=$(cat dist/release.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
      - name: Verify restored version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED: ${{ needs.artifact.outputs.provenance }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors "${PAGE_URL%/}/release.json?run=$GITHUB_RUN_ID" -o deployed.json
          printf '%s\n' "$EXPECTED" > expected.json
          cmp expected.json deployed.json