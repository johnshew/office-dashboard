name: Phone Link release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Independent Worker deploy, additive D1 initialization, or explicit-version rollback
        required: true
        type: choice
        options: [deploy, initialize, rollback]
      source_ref:
        description: Full accepted default-branch commit SHA or existing immutable vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      schema_confirmation:
        description: For initialize only, enter apply-reviewed-phone-link-schema after reviewing SQL
        type: string
      rollback_version_id:
        description: For rollback, existing compatible Phone Link Worker version UUID
        type: string
      rollback_confirmation:
        description: For rollback, enter compatible-schema-and-secrets after reviewing compatibility
        type: string

permissions:
  contents: read
  actions: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - id: source
        name: Verify exact source and release workflow provenance
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: node scripts/worker-release.js source
      - name: Require successful default-branch CI for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api --method GET "repos/$GH_REPO/actions/workflows/pages.yml/runs" \
            -f head_sha="$SOURCE_COMMIT" -f branch="$DEFAULT_BRANCH" -f event=push -f status=success -f per_page=100 \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | length' > accepted-runs.txt
          [[ "$(cat accepted-runs.txt)" -gt 0 ]] || { echo 'Exact source needs successful default-branch CI before Worker release.'; exit 1; }
      - name: Require preconfigured production environment approvals
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          approved_environment="$(gh api "repos/$GH_REPO/environments/cloudflare-phone-link" \
            --jq 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0)')"
          [[ "$approved_environment" == true ]] || { echo 'Configure required reviewers on cloudflare-phone-link before release.'; exit 1; }

  production:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-cloudflare-phone-link
      cancel-in-progress: false
    environment:
      name: cloudflare-phone-link
      url: ${{ vars.PHONE_SERVICE_ORIGIN }}
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      PHONE_WORKER_NAME: ${{ vars.PHONE_WORKER_NAME }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      PHONE_SERVICE_ORIGIN: ${{ vars.PHONE_SERVICE_ORIGIN }}
      PHONE_CLIENT_ID: ${{ vars.PHONE_CLIENT_ID }}
      PHONE_TENANT_ID: ${{ vars.PHONE_TENANT_ID }}
      PHONE_ACCOUNT_AUDIENCE: ${{ vars.PHONE_ACCOUNT_AUDIENCE }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      OPERATION: ${{ inputs.operation }}
      SCHEMA_CONFIRMATION: ${{ inputs.schema_confirmation }}
      ROLLBACK_VERSION_ID: ${{ inputs.rollback_version_id }}
      ROLLBACK_CONFIRMATION: ${{ inputs.rollback_confirmation }}
      RELEASE_HELPER: ${{ runner.temp }}/worker-release.mjs
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Use dispatch tooling with the exact accepted application source
        run: git show "$WORKFLOW_COMMIT:scripts/worker-release.js" > "$RELEASE_HELPER"
      - name: Generate fail-closed public deployment configuration
        run: node "$RELEASE_HELPER" prepare
      - name: Bundle exact reviewed Worker without cloud credentials
        if: inputs.operation == 'deploy'
        run: |
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run \
            --config dist-worker/phone-link-build.json --outdir "$PWD/dist-worker/phone-link-bundle"
          cp dist-worker/phone-link-bundle/index.js dist-worker/phone-link-release/worker.js
      - name: Seal reviewed bundle or initialization SQL and public configuration
        if: inputs.operation != 'rollback'
        run: node "$RELEASE_HELPER" seal
      - name: Preserve exact bytes and source digests before cloud changes
        if: inputs.operation != 'rollback'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-link-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-worker/phone-link-release/
          if-no-files-found: error
          retention-days: 90
      - name: Run explicit cloud operation and verify readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node "$RELEASE_HELPER" check
          config=dist-worker/phone-link-release/wrangler.json
          # Keep provider diagnostics private; preserve only the sanitized receipt.
          if ! {
            case "$OPERATION" in
              deploy)
                node node_modules/wrangler/bin/wrangler.js deploy --no-bundle --config "$config" \
                  --tag "commit-$SOURCE_COMMIT" --message "Phone Link accepted commit $SOURCE_COMMIT"
                ;;
              initialize)
                node node_modules/wrangler/bin/wrangler.js d1 execute PAIRING_DB --remote --config "$config" \
                  --file dist-worker/phone-link-release/schema.sql --yes
                ;;
              rollback)
                node node_modules/wrangler/bin/wrangler.js rollback "$ROLLBACK_VERSION_ID" --yes --config "$config" \
                  --message "Reviewed Phone Link rollback from $SOURCE_COMMIT"
                ;;
              *) exit 1 ;;
            esac
          } > dist-worker/wrangler-output.txt 2>&1; then
            echo 'Wrangler operation failed; inspect provider diagnostics privately. Cloud state may have changed.'
            exit 1
          fi
          node "$RELEASE_HELPER" finish
      - name: Preserve sanitized deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-link-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-worker/phone-link-release/deployment.json
          if-no-files-found: ignore
          retention-days: 90
